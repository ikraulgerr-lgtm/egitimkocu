workflows:
  ios-release:
    name: iOS App Store Release (Egitim Kocum AI)
    instance_type: mac_mini_m1
    max_build_duration: 30
    integrations:
      app_store_connect: AppStoreKey
    environment:
      node: 22
      xcode: latest
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build Web Application
        script: |
          npm run build
      - name: Sync iOS Platform
        script: |
          npx cap sync ios
      - name: Set up code signing (fetch or create certificates and profiles)
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.egitimkocumai" \
            --type IOS_APP_STORE \
            --create
          keychain add-certificates
          xcode-project use-profiles
      - name: Build and Package IPA for App Store
        script: |
          cd ios/App
          xcode-project build-ipa \
            --project App.xcodeproj \
            --scheme App \
            --clean
    artifacts:
      - build/ios/ipa/*.ipa
      - /Users/builder/export/*.ipa
      - "*.ipa"
      - "**/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
