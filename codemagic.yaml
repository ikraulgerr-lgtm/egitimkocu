workflows:
  ios-release:
    name: iOS App Store Release (Egitim Kocum AI)
    instance_type: mac_mini_m1
    max_build_duration: 30
    integrations:
      app_store_connect: AppStoreKey
    environment:
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.egitimkocumai"
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build Web Application
        script: |
          npm run build
      - name: Sync iOS Platform
        script: |
          npx cap sync ios
          node scripts/patch-speech.js
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates --certificate ios/App/ios_distribution.p12 --certificate-password 123456 || \
            security import ios/App/ios_distribution.p12 -P "123456" -A
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp ios/App/egitimkocu.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Set dynamic build version
        script: |
          LATEST_BUILD_NUM=$(app-store-connect get-latest-testflight-build-number "$BUNDLE_ID" 2>/dev/null || echo 0)
          if [ -z "$LATEST_BUILD_NUM" ] || [ "$LATEST_BUILD_NUM" = "0" ] 2>/dev/null; then
            BUILD_NUM=$((150 + ${BUILD_NUMBER:-1}))
          else
            BUILD_NUM=$((LATEST_BUILD_NUM + 1))
          fi
          echo "Setting dynamic build number to: $BUILD_NUM and marketing version to: 1.0.4"
          sed -i '' "s/CURRENT_PROJECT_VERSION = .*;/CURRENT_PROJECT_VERSION = $BUILD_NUM;/g" ios/App/App.xcodeproj/project.pbxproj
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = 1.0.4;/g" ios/App/App.xcodeproj/project.pbxproj
          cd ios/App && agvtool new-version -all $BUILD_NUM && agvtool new-marketing-version "1.0.4" && cd ../.. || true
      - name: Build and Package IPA for App Store
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /Users/builder/export/*.ipa
      - "*.ipa"
      - "**/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false

