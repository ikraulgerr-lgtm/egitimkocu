workflows:
  ios-release:
    name: iOS App Store Release (Egitim Kocum AI)
    instance_type: mac_mini_m1
    max_build_duration: 30
    integrations:
      app_store_connect: AppStoreKey
    environment:
      node: 22
      xcode: latest
      vars:
        XCODE_PROJECT: "ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
        BUNDLE_ID: "com.egitimkocumai"
    scripts:
      - name: Install dependencies
        script: |
          npm ci
      - name: Build Web Application
        script: |
          npm run build
      - name: Sync iOS Platform
        script: |
          npx cap sync ios
      - name: Set up code signing
        script: |
          keychain initialize
          keychain add-certificates --certificate ios/App/ios_distribution.p12 --certificate-password 123456 || \
            security import ios/App/ios_distribution.p12 -P "123456" -A
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp ios/App/egitimkocu.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"
          xcode-project use-profiles --project "$XCODE_PROJECT"
      - name: Build and Package IPA for App Store
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /Users/builder/export/*.ipa
      - "*.ipa"
      - "**/*.ipa"
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
